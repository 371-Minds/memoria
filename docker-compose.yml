services:
  memoria:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides anything in .env: inside the container the database is here.
      MEMORIA_DB_PATH: /app/data/memoria.db
    volumes:
      # One SQLite file, on the host. Without this line, every rebuild loses memory.
      - memoria_data:/app/data
    restart: unless-stopped

volumes:
  memoria_data:
